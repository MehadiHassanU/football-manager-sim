<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touchline Legend — Store Assets Preview</title>
<style>
  body { background: #0B1220; color: #E6EBF2; font-family: "Segoe UI", sans-serif; margin: 0; padding: 40px; }
  h1 { letter-spacing: -0.02em; }
  h2 { color: #00C853; margin-top: 48px; }
  .grid { display: flex; gap: 24px; flex-wrap: wrap; }
  .card { background: #121B2B; border: 1px solid #24334E; border-radius: 12px; padding: 16px; }
  img { border-radius: 8px; display: block; }
  .icon img { width: 256px; height: 256px; }
  .feature img { width: 640px; max-width: 100%; }
  .shot img { width: 300px; }
  .label { margin-top: 10px; font-size: 13px; color: #8FA1BC; }
</style>
</head>
<body>
  <h1>Touchline Legend</h1>
  <p style="color:#8FA1BC">Your Tactics. Your Club. Your Legacy. — generated store assets</p>

  <h2>App icon · 512×512</h2>
  <div class="card icon">
    <img src="icon-512.png" alt="App icon">
    <div class="label">icon-512.png</div>
  </div>

  <h2>Feature graphic · 1024×512</h2>
  <div class="card feature">
    <img src="feature-graphic.png" alt="Feature graphic">
    <div class="label">feature-graphic.png</div>
  </div>

  <h2>Phone screenshots · 1080×1920</h2>
  <div class="grid">
    <div class="card shot">
      <img src="screenshot-dashboard.png" alt="Dashboard screenshot">
      <div class="label">screenshot-dashboard.png</div>
    </div>
    <div class="card shot">
      <img src="screenshot-match.png" alt="Match screenshot">
      <div class="label">screenshot-match.png</div>
    </div>
    <div class="card shot">
      <img src="screenshot-squad.png" alt="Squad screenshot">
      <div class="label">screenshot-squad.png</div>
    </div>
  </div>
</body>
</html>
